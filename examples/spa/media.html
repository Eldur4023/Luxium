<!doctype html>
<html><head><title>SPA media</title></head>
<body>
<video id="v" src="x.mp4"></video>
<script>
fn Element video():
    return document.get("v")

fn void on_play():
    log.info("event play paused=" + str(video().paused()))
fn void on_pause():
    log.info("event pause")
fn void on_ended():
    log.info("event ended")
fn void on_seeked():
    log.info("event seeked t=" + str(math.floor(video().current_time())))
fn void on_meta():
    log.info("event loadedmetadata dur=" + str(video().duration()))
fn void on_cue():
    log.info("event cuechange cue=[" + video().cue() + "]")
fn void on_time():
    page.set("times", int(page.get("times")) + 1)

page.set("times", 0)
document.get("v").listen("play", on_play)
document.get("v").listen("pause", on_pause)
document.get("v").listen("ended", on_ended)
document.get("v").listen("seeked", on_seeked)
document.get("v").listen("loadedmetadata", on_meta)
document.get("v").listen("cuechange", on_cue)
document.get("v").listen("timeupdate", on_time)

fn void run():
    await sleep(100)
    log.info("tracks: audio=" + str(len(video().audio_tracks())) + " text=" + str(len(video().text_tracks())) + " current=" + video().audio_tracks()[0]["label"])
    video().select_audio(1)
    log.info("audio now " + video().audio_tracks()[1]["label"] + " current=" + str(video().audio_tracks()[1]["current"]))
    video().select_text(1)
    log.info("text now " + video().text_tracks()[0]["label"])
    video().select_text(-1)
    log.info("text off " + str(video().text_tracks()[0]["current"]))
    video().select_text(0)
    video().play()
    await sleep(300)
    video().seek(1.9)
    await sleep(300)
    video().pause()
    await sleep(100)
    video().set_volume(0.5)
    video().set_muted(true)
    log.info("vol " + str(video().volume()) + " muted=" + str(video().muted()))
    video().seek(9.8)
    video().play()
    await sleep(600)
    log.info("ended=" + str(video().ended()) + " timeupdates>0: " + str(int(page.get("times")) > 0))
    log.info("run done")

run()
</script>
</body></html>
