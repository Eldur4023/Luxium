<!doctype html>
<meta charset="utf-8">
<script src="probe.js"></script>
<title>hls.js</title>
<style>body{margin:0;background:#222} video{width:640px;display:block}</style>
<video id="v" controls preload="auto"></video>
<script src="hls.min.js"></script>
<script>
const v = document.getElementById('v'); __probe(v);
window.__hls = { isSupported: Hls.isSupported(), native: v.canPlayType('application/vnd.apple.mpegurl') };
if (Hls.isSupported()) { const h = new Hls(); h.loadSource('fixtures/hls_ts/index.m3u8'); h.attachMedia(v); }
else if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = 'fixtures/hls_ts/index.m3u8';
</script>
