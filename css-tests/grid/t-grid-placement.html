<!doctype html>
<meta charset="utf-8">
<style>
body { font-family: 'DejaVu Sans'; margin: 10px; background: #ffffff; color: #222222; }
</style>
<style>
.g { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.i { background: #1d8a2e; color: #fff; padding: 10px; }
.span { grid-column: 1 / 3; }
.col2 { grid-column: 3; }
.col1 { grid-column: 1; }
</style>
<div class="g" data-t="cont">
  <div class="i" data-t="span">columnas 1 a 3</div>
  <div class="i" data-t="col2">columna 3</div>
  <div class="i" data-t="col1">columna 1</div>
</div>
