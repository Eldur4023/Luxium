<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>Homeflix picker</title>
<link rel="stylesheet" href="style.css"><style>*,*::before,*::after{transition:none!important;animation:none!important}</style></head>
<body>

  <header class="topbar" data-t="e0">
    <a class="logo" href="/" data-link="" data-t="e1">
      <img class="logo-img" src="logo.webp" alt="" data-t="e2">
      HOMEFLIX
    </a>
    <div class="topbar-actions" data-t="e3">
      <span id="topbar-user-actions">
    
    <a class="user-chip" href="/perfil" data-t="e4">
      <img class="user-avatar" src="poster.png" alt="Avatar de Jesús" data-t="e5">
      <span class="user-name" data-t="e6">Jesús</span>
    </a>
  </span>
    </div>
  </header>

  <!-- Loading indicator (persistent) -->
  

  <main class="container" id="app" data-page="-usuarios" data-t="e7">
    <div class="user-picker" data-t="e8">
      <h1 data-t="e9">¿Quién eres?</h1>
      <div class="user-grid" data-t="e10">
        
          <button class="user-card" type="button" data-user-id="1" data-user-name="Jesús" data-t="e11">
            <img class="user-card-avatar" src="poster.png" alt="Avatar de Jesús" data-t="e12">
            <span>Jesús</span>
          </button>
        
          <button class="user-card" type="button" data-user-id="2" data-user-name="Ana" data-t="e13">
            <img class="user-card-avatar" src="poster.png" alt="Avatar de Ana" data-t="e14">
            <span>Ana</span>
          </button>
        
          <button class="user-card" type="button" data-user-id="3" data-user-name="Invitado" data-t="e15">
            <img class="user-card-avatar" src="poster.png" alt="Avatar de Invitado" data-t="e16">
            <span>Invitado</span>
          </button>
        
      </div>
      <form class="user-create" id="user-create-form" novalidate="" data-t="e17">
        <input type="text" name="name" placeholder="Nuevo usuario…" maxlength="30" required="" data-t="e18">
        <button type="submit" data-t="e19">Crear</button>
      </form>
    </div>
  </main>

  <dialog class="confirm-modal" id="confirm-modal" data-modal="">
    <form method="dialog">
      <p class="confirm-modal-message" id="confirm-modal-message"></p>
      <div class="confirm-modal-actions">
        <button type="submit" class="nav-button" value="cancel">Cancelar</button>
        <button type="submit" class="danger-button" id="confirm-modal-accept" value="ok">Borrar</button>
      </div>
    </form>
  </dialog>

  <dialog class="confirm-modal prompt-modal" id="prompt-modal" data-modal="">
    <form method="dialog">
      <p class="confirm-modal-message" id="prompt-modal-message"></p>
      <input class="prompt-modal-input" id="prompt-modal-input" type="text" autocomplete="off">
      <div class="confirm-modal-actions">
        <button type="submit" class="nav-button" value="cancel" formnovalidate="">Cancelar</button>
        <button type="submit" class="primary-button" id="prompt-modal-accept" value="ok">Aceptar</button>
      </div>
    </form>
  </dialog>

  <div class="app-toasts" id="app-toasts" aria-live="polite"></div>

  
  
  
  
  
  
  
  
  



</body></html>
