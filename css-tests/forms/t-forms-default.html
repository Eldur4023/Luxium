<!doctype html>
<html><head><meta charset="utf-8"><title>forms default metrics</title>
<style>body{margin:8px;font:16px Arial} div{margin:6px 0}</style></head>
<body>
<div><input data-t="text" type="text" value="hello"></div>
<div><input data-t="empty" type="text" placeholder="Placeholder"></div>
<div><input data-t="pw" type="password" value="secret"></div>
<div><input data-t="search" type="search" value="abc"></div>
<div><input data-t="num" type="number" value="3"></div>
<div><input data-t="size10" type="text" size="10" value="x"></div>
<div><input data-t="big" type="text" style="font-size:20px" value="Big"></div>
<div><label data-t="lab"><input data-t="chk" type="checkbox" checked> Check</label> <input data-t="chk2" type="checkbox"> <input data-t="rad" type="radio" checked> <input data-t="rad2" type="radio"></div>
<div><select data-t="sel"><option>Uno</option><option selected>Dos larga</option></select></div>
<div><textarea data-t="ta">text area</textarea></div>
<div><textarea data-t="ta2" rows="4" cols="30"></textarea></div>
<div><input data-t="range" type="range"></div>
<div><input data-t="file" type="file"></div>
<div><button data-t="btn">Button</button> <input data-t="isub" type="submit" value="Go"></div>
<div><input data-t="dis" type="text" value="off" disabled></div>
</body></html>
