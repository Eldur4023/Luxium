<!doctype html>
<meta charset="utf-8">
<style>
body { font-family: 'DejaVu Sans'; margin: 10px; background: #ffffff; color: #222222; font-size: 14px; counter-reset: sec; line-height: 1.2; }
.row { margin: 4px 0; }
h3 { counter-reset: sub; counter-increment: sec; margin: 4px 0; font-size: 14px; }
h3::before { content: counter(sec) ". "; color: #c00; }
h4 { counter-increment: sub; margin: 2px 0 2px 20px; font-size: 13px; font-weight: normal; }
h4::before { content: counter(sec) "." counter(sub) " - "; color: #06c; }
.nest, .nest div { counter-reset: item; }
.nest div { margin-left: 16px; }
.nest p { counter-increment: item; margin: 1px 0; }
.nest p::before { content: counters(item, ".") ") "; color: #080; }
.styles span { display: block; counter-increment: st; }
.styles { counter-reset: st; }
.s1::before { content: counter(st, decimal-leading-zero) " "; }
.s2::before { content: counter(st, lower-alpha) " "; }
.s3::before { content: counter(st, upper-alpha) " "; }
.s4::before { content: counter(st, lower-roman) " "; }
.s5::before { content: counter(st, upper-roman) " "; }
.s6::before { content: counter(st, lower-latin) "/" counter(st, upper-latin) " "; }
.s7::before { content: counter(st, disc) counter(st, circle) counter(st, none) "|"; }
.cs span { counter-increment: c 5; }
.cs { counter-reset: c 10; }
.cs span::after { content: " [" counter(c) "]"; color: #a0a; }
.set { counter-reset: z 3; }
.set b { counter-set: z 40; }
.set i { counter-increment: z -2; }
.set u::before { content: counter(z); }
.ol { counter-reset: n; }
.ol li { counter-increment: n; }
.ol li::after { content: " (" counter(n) ")"; color: #888; }
.dlz { list-style: decimal-leading-zero; }
.none { counter-increment: q; }
.none::before { content: counter(q) counters(q, "-"); }
.sep { counter-reset: x 2; }
.sep > i { counter-reset: x; display: block; }
.sep > i::before { content: counters(x, "+", upper-roman); }
.hid { display: none; counter-increment: hh; }
.vis::before { content: "[" counter(hh) "]"; }
</style>
