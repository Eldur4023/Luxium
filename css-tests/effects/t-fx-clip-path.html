<!doctype html>
<meta charset="utf-8">
<style>
body { font-family: 'DejaVu Sans'; margin: 10px; background: #ffffff; color: #222222; }
.g { display: grid; grid-template-columns: repeat(5, 200px); gap: 16px; }
.b { height: 90px; background: linear-gradient(90deg, #e50914, #2a7fff 50%, #38c172); color: #fff; font-weight: bold; padding: 8px; box-sizing: border-box; border: 6px solid #222; }
.c { margin: 8px; }
</style>
<div class="g">
<div class="b" style="clip-path: inset(10px)" data-t="c1">inset</div>
<div class="b" style="clip-path: inset(5px 20px 15px 30px round 12px)" data-t="c2">inset round</div>
<div class="b" style="clip-path: inset(0 round 20px 4px / 10px 30px)" data-t="c3">inset ell</div>
<div class="b" style="clip-path: circle(40px)" data-t="c4">circle</div>
<div class="b" style="clip-path: circle(50% at 25% 50%)" data-t="c5">circle at</div>
<div class="b" style="clip-path: circle()" data-t="c6">circle def</div>
<div class="b" style="clip-path: circle(farthest-side at 20px 30px)" data-t="c7">farthest</div>
<div class="b" style="clip-path: ellipse(80px 30px at 50% 50%)" data-t="c8">ellipse</div>
<div class="b" style="clip-path: ellipse(closest-side farthest-side at 70% 30%)" data-t="c9">ellipse kw</div>
<div class="b" style="clip-path: polygon(50% 0, 100% 100%, 0 100%)" data-t="c10">triangle</div>
<div class="b" style="clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)" data-t="c11">star</div>
<div class="b" style="clip-path: polygon(evenodd, 50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)" data-t="c12">star eo</div>
<div class="b" style="clip-path: polygon(nonzero, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, 25% 25%, 75% 25%, 75% 75%, 25% 75%, 25% 25%)" data-t="c13">hole nz</div>
<div class="b" style="clip-path: inset(10px) padding-box" data-t="c14">padding-box</div>
<div class="b" style="clip-path: circle(30px at center) content-box; padding: 20px" data-t="c15">content-box</div>
<div class="b" style="clip-path: margin-box inset(0); margin: 10px" data-t="c16">margin-box</div>
<div class="b" style="clip-path: none" data-t="c17">none</div>
<div class="b" style="clip-path: inset(0 0 0 50%); opacity: .7" data-t="c18">with opacity</div>
<div class="b" style="clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 20px" data-t="c19">radius</div>
<div class="b" style="clip-path: border-box" data-t="c20">only box</div>
<div class="b" style="clip-path: polygon(0 0, 100% 0)" data-t="c21">degenerate</div>
<div class="b" style="clip-path: circle(20px 30px)" data-t="c22">invalid</div>
<div class="b" style="clip-path: inset(10px); overflow: hidden"><div style="width:300px;height:30px;background:#000;color:#fff">child overflow</div></div>
<div class="b" style="clip-path: polygon(10% 10%, 90% 10%, 50% 90%); transform: rotate(5deg)" data-t="c24">transformed</div>
</div>
